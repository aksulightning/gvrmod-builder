name: Build nightly all-in-one

on:
  workflow_dispatch:
  schedule:
    # Sunday 00:30 UTC
    - cron: "30 0 * * 0"

permissions:
  contents: read

concurrency:
  group: gvrmod-nightly
  cancel-in-progress: true

env:
  GVRMOD_REPOSITORY: Abyss-c0re/gVRMod
  GVRMOD_REF: main

  OPENVR_MODULE_REPOSITORY: Abyss-c0re/vrmod-module-master
  OPENVR_MODULE_REF: main

  VRMOD_X64_REPOSITORY: Abyss-c0re/vrmod-x64
  VRMOD_X64_REF: main

  OPENVR_SDK_REPOSITORY: ValveSoftware/openvr
  OPENVR_SDK_REF: master

  OPENXR_SDK_REPOSITORY: KhronosGroup/OpenXR-SDK
  OPENXR_SDK_REF: main

jobs:
  resolve:
    name: Resolve immutable revisions
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    outputs:
      gvrmod_sha: ${{ steps.refs.outputs.gvrmod_sha }}
      openvr_module_sha: ${{ steps.refs.outputs.openvr_module_sha }}
      vrmod_x64_sha: ${{ steps.refs.outputs.vrmod_x64_sha }}
      openvr_sdk_sha: ${{ steps.refs.outputs.openvr_sdk_sha }}
      openxr_sdk_sha: ${{ steps.refs.outputs.openxr_sdk_sha }}

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Resolve repository revisions
        id: refs
        shell: bash
        run: |
          set -euo pipefail

          resolve_ref() {
            local repository="$1"
            local reference="$2"
            local output_name="$3"
            local sha

            sha="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/${repository}/commits/${reference}" \
                --jq '.sha'
            )"

            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Could not resolve ${repository}@${reference}"
              exit 1
            fi

            echo "${output_name}=${sha}" >> "$GITHUB_OUTPUT"
            echo "${repository}@${reference} -> ${sha}"
          }

          resolve_ref \
            "$GVRMOD_REPOSITORY" \
            "$GVRMOD_REF" \
            "gvrmod_sha"

          resolve_ref \
            "$OPENVR_MODULE_REPOSITORY" \
            "$OPENVR_MODULE_REF" \
            "openvr_module_sha"

          resolve_ref \
            "$VRMOD_X64_REPOSITORY" \
            "$VRMOD_X64_REF" \
            "vrmod_x64_sha"

          resolve_ref \
            "$OPENVR_SDK_REPOSITORY" \
            "$OPENVR_SDK_REF" \
            "openvr_sdk_sha"

          resolve_ref \
            "$OPENXR_SDK_REPOSITORY" \
            "$OPENXR_SDK_REF" \
            "openxr_sdk_sha"

  linux:
    name: Linux x86-64
    needs: resolve
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout gVRMod
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.GVRMOD_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.gvrmod_sha }}
          path: src/gvrmod
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Checkout vrmod-x64 addon
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.VRMOD_X64_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.vrmod_x64_sha }}
          path: src/gvrmod/addon/vrmod-x64
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout OpenVR Garry's Mod module
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.OPENVR_MODULE_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.openvr_module_sha }}
          path: src/openvr-module
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout OpenVR runtime library
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.OPENVR_SDK_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.openvr_sdk_sha }}
          path: src/openvr-sdk
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            bin/linux64/libopenvr_api.so
            LICENSE

      - name: Checkout OpenXR SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.OPENXR_SDK_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.openxr_sdk_sha }}
          path: src/openxr-sdk
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Verify source layout
        shell: bash
        run: |
          set -euo pipefail

          test -f src/gvrmod/CMakeLists.txt
          test -f src/gvrmod/addon/vrmod-x64/addon.json
          test -f src/openvr-module/src/vrmod.cpp
          test -f src/openvr-module/deps/openvr/openvr.h
          test -f src/openvr-sdk/bin/linux64/libopenvr_api.so
          test -f src/openxr-sdk/CMakeLists.txt
          test -f src/openxr-sdk/include/openxr/openxr.h

          header="src/openvr-module/deps/openvr/openvr.h"

          grep -q "GetPoseActionDataRelativeToNow" "$header"
          grep -q "EVRSummaryType" "$header"
          grep -q "GetSkeletalSummaryData" "$header"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            python3 \
            file \
            zip \
            lua5.1 \
            libgl1-mesa-dev \
            libglx-dev \
            libx11-dev \
            libxrandr-dev \
            libxxf86vm-dev \
            libvulkan-dev \
            libjsoncpp-dev

      - name: Prepare gVRMod build dependencies
        shell: bash
        run: |
          set -euo pipefail

          gvrmod="$GITHUB_WORKSPACE/src/gvrmod"
          openvr_module="$GITHUB_WORKSPACE/src/openvr-module"
          openxr_sdk="$GITHUB_WORKSPACE/src/openxr-sdk"

          rm -rf "$gvrmod/deps"
          mkdir -p "$gvrmod/deps/openxr"

          cp -a \
            "$openvr_module/deps/gmod" \
            "$gvrmod/deps/gmod"

          cp -a \
            "$openxr_sdk/include/openxr" \
            "$gvrmod/deps/openxr/openxr"

          test -f "$gvrmod/deps/gmod/Interface.h"
          test -f "$gvrmod/deps/openxr/openxr/openxr.h"
          test -f "$gvrmod/deps/openxr/openxr/openxr_platform.h"

      - name: Build gVRMod and run Linux C++ tests
        shell: bash
        run: |
          set -euo pipefail

          source_dir="$GITHUB_WORKSPACE/src/gvrmod"
          build_dir="$GITHUB_WORKSPACE/build/gvrmod-linux"

          cmake \
            -S "$source_dir" \
            -B "$build_dir" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVRMOD_BUILD_TESTS=ON \
            -DVRMOD_BUILD_QUEST=ON

          cmake \
            --build "$build_dir" \
            --target vrmod_release vrmod_quest vrmod_tests \
            --parallel 2

          test_binary="$(
            find "$build_dir" \
              -type f \
              -name 'vrmod_tests' \
              -perm -111 \
              -print \
              -quit
          )"

          if [[ -z "$test_binary" ]]; then
            echo "::error::vrmod_tests was not generated"
            exit 1
          fi

          test_binary="$(realpath "$test_binary")"

          # The upstream tests use POSIX /tmp paths, so their authoritative
          # execution environment is Linux.
          (
            cd "$source_dir"
            "$test_binary"
          )

      - name: Run contract, Lua and scenario tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/src/gvrmod"

          python3 scripts/gen_contracts.py
          python3 scripts/check_test_contracts.py

          lua5.1 tests/lua/run.lua
          lua5.1 tests/scenarios/run.lua

      - name: Build OpenVR Garry's Mod module
        shell: bash
        run: |
          set -euo pipefail

          module="$GITHUB_WORKSPACE/src/openvr-module"
          openvr_sdk="$GITHUB_WORKSPACE/src/openvr-sdk"
          output="$GITHUB_WORKSPACE/out"

          mkdir -p "$output"

          # Use the header vendored by vrmod-module-master. It contains the
          # IVRInput API expected by that repository. Valve's checkout is
          # used only for the ABI-compatible runtime library.
          g++ \
            -std=c++17 \
            -fPIC \
            -shared \
            -m64 \
            -O3 \
            -I "$module/deps" \
            "$module/src/vrmod.cpp" \
            -L "$openvr_sdk/bin/linux64" \
            -lopenvr_api \
            -ldl \
            -Wl,-rpath,\$ORIGIN \
            -o "$output/gmcl_vrmod_linux64.dll"

          cp -L \
            "$openvr_sdk/bin/linux64/libopenvr_api.so" \
            "$output/libopenvr_api.so"

      - name: Build OpenXR loader
        shell: bash
        run: |
          set -euo pipefail

          source_dir="$GITHUB_WORKSPACE/src/openxr-sdk"
          build_dir="$GITHUB_WORKSPACE/build/openxr-linux"
          output="$GITHUB_WORKSPACE/out"

          cmake \
            -S "$source_dir" \
            -B "$build_dir" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_CONFORMANCE_TESTS=OFF \
            -DBUILD_API_LAYERS=OFF

          cmake \
            --build "$build_dir" \
            --target openxr_loader \
            --parallel 2

          loader="$(
            find "$build_dir" \
              -type f \
              -name 'libopenxr_loader.so*' \
              -print \
              | sort \
              | head -n 1
          )"

          if [[ -z "$loader" ]]; then
            echo "::error::libopenxr_loader.so was not generated"
            exit 1
          fi

          # Store real files instead of symlinks so the ZIP behaves
          # consistently on Windows and Linux extraction tools.
          cp -L "$loader" "$output/libopenxr_loader.so"
          cp -L "$loader" "$output/libopenxr_loader.so.1"

      - name: Collect Linux modules and licenses
        shell: bash
        run: |
          set -euo pipefail

          output="$GITHUB_WORKSPACE/out"
          install_bin="$GITHUB_WORKSPACE/src/gvrmod/install/GarrysMod/garrysmod/lua/bin"

          mkdir -p "$output/licenses"

          copy_built_module() {
            local name="$1"
            local source

            source="$(
              find "$install_bin" \
                -type f \
                -name "$name" \
                -print \
                -quit
            )"

            if [[ -z "$source" ]]; then
              echo "::error::Missing gVRMod module: ${name}"
              exit 1
            fi

            cp -L "$source" "$output/$name"
          }

          copy_built_module "gmcl_vrmod_xr_linux64.dll"
          copy_built_module "gmcl_vrmod_quest_linux64.dll"

          cp \
            src/gvrmod/LICENSE \
            "$output/licenses/gVRMod-LICENSE.txt"

          cp \
            src/gvrmod/addon/vrmod-x64/LICENSE \
            "$output/licenses/vrmod-x64-LICENSE.txt"

          cp \
            src/openvr-module/LICENSE \
            "$output/licenses/vrmod-module-master-LICENSE.txt"

          cp \
            src/openvr-sdk/LICENSE \
            "$output/licenses/OpenVR-LICENSE.txt"

          cp \
            src/openxr-sdk/LICENSE \
            "$output/licenses/OpenXR-SDK-LICENSE.txt"

      - name: Validate Linux artifacts
        shell: bash
        run: |
          set -euo pipefail

          required=(
            gmcl_vrmod_xr_linux64.dll
            gmcl_vrmod_linux64.dll
            gmcl_vrmod_quest_linux64.dll
            libopenvr_api.so
            libopenxr_loader.so
            libopenxr_loader.so.1
          )

          for name in "${required[@]}"; do
            path="$GITHUB_WORKSPACE/out/$name"

            test -s "$path"

            if ! file "$path" | grep -Eq 'ELF 64-bit.*x86-64'; then
              echo "::error file=${path}::Not an x86-64 ELF binary"
              file "$path"
              exit 1
            fi
          done

          for module in \
            "$GITHUB_WORKSPACE/out/gmcl_vrmod_xr_linux64.dll" \
            "$GITHUB_WORKSPACE/out/gmcl_vrmod_linux64.dll" \
            "$GITHUB_WORKSPACE/out/gmcl_vrmod_quest_linux64.dll"
          do
            dependencies="$(
              LD_LIBRARY_PATH="$GITHUB_WORKSPACE/out" ldd "$module"
            )"

            echo "$dependencies"

            if grep -q 'not found' <<< "$dependencies"; then
              echo "::error file=${module}::Unresolved shared-library dependency"
              exit 1
            fi
          done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gvrmod-linux-x64
          path: out
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  windows:
    name: Windows and Wine x86-64
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout gVRMod
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.GVRMOD_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.gvrmod_sha }}
          path: src/gvrmod
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Checkout OpenVR Garry's Mod module
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.OPENVR_MODULE_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.openvr_module_sha }}
          path: src/openvr-module
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout OpenVR runtime library
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.OPENVR_SDK_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.openvr_sdk_sha }}
          path: src/openvr-sdk
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            lib/win64/openvr_api.lib
            bin/win64/openvr_api.dll
            LICENSE

      - name: Checkout OpenXR SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.OPENXR_SDK_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.openxr_sdk_sha }}
          path: src/openxr-sdk
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Verify source layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "src\gvrmod\CMakeLists.txt",
            "src\openvr-module\src\vrmod.cpp",
            "src\openvr-module\deps\openvr\openvr.h",
            "src\openvr-sdk\lib\win64\openvr_api.lib",
            "src\openvr-sdk\bin\win64\openvr_api.dll",
            "src\openxr-sdk\CMakeLists.txt",
            "src\openxr-sdk\include\openxr\openxr.h"
          )

          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required source file does not exist: $path"
            }
          }

          $header = "src\openvr-module\deps\openvr\openvr.h"

          foreach ($symbol in @(
            "GetPoseActionDataRelativeToNow",
            "EVRSummaryType",
            "GetSkeletalSummaryData"
          )) {
            if (-not (Select-String -LiteralPath $header -Pattern $symbol -Quiet)) {
              throw "Vendored OpenVR header is missing: $symbol"
            }
          }

      - name: Prepare gVRMod dependencies and Windows type shim
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $gvrmod = Join-Path $env:GITHUB_WORKSPACE "src\gvrmod"
          $module = Join-Path $env:GITHUB_WORKSPACE "src\openvr-module"
          $openxr = Join-Path $env:GITHUB_WORKSPACE "src\openxr-sdk"

          $deps = Join-Path $gvrmod "deps"

          if (Test-Path -LiteralPath $deps) {
            Remove-Item -LiteralPath $deps -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path (Join-Path $deps "openxr") `
            -Force | Out-Null

          Copy-Item `
            -LiteralPath (Join-Path $module "deps\gmod") `
            -Destination (Join-Path $deps "gmod") `
            -Recurse `
            -Force

          Copy-Item `
            -LiteralPath (Join-Path $openxr "include\openxr") `
            -Destination (Join-Path $deps "openxr\openxr") `
            -Recurse `
            -Force

          # gVRMod's Windows path declares several GLuint variables without
          # including an OpenGL header. Force-include this build-only shim.
          # No OpenVR/OpenXR/SteamVR source file is patched.
          $shim = Join-Path $env:RUNNER_TEMP "gvrmod_windows_types.h"

          @'
          #pragma once
          #ifdef _WIN32
          using GLuint = unsigned int;
          #endif
          '@ | Set-Content -LiteralPath $shim -Encoding ascii

          if (-not (Test-Path -LiteralPath $shim -PathType Leaf)) {
            throw "Failed to create the Windows type shim"
          }

      - name: Build gVRMod OpenXR module
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path $env:GITHUB_WORKSPACE "src\gvrmod"
          $build = Join-Path $env:GITHUB_WORKSPACE "build\gvrmod-windows"
          $shim = Join-Path $env:RUNNER_TEMP "gvrmod_windows_types.h"

          # The upstream C++ tests use hard-coded /tmp paths. They are run
          # as a mandatory gate in the Linux job. Windows still has strict
          # compilation and PE validation below.
          $env:CL = "/FI`"$shim`""

          $configure = @(
            "-S", $source,
            "-B", $build,
            "-A", "x64",
            "-DVRMOD_BUILD_TESTS=OFF",
            "-DVRMOD_BUILD_QUEST=OFF"
          )

          & cmake @configure

          if ($LASTEXITCODE -ne 0) {
            throw "gVRMod CMake configuration failed: $LASTEXITCODE"
          }

          $buildArguments = @(
            "--build", $build,
            "--config", "Release",
            "--target", "vrmod_release",
            "--parallel", "2"
          )

          & cmake @buildArguments

          if ($LASTEXITCODE -ne 0) {
            throw "gVRMod Windows build failed: $LASTEXITCODE"
          }

      - name: Initialize MSVC environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = Join-Path `
            ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer\vswhere.exe"

          $vsInstall = & $vswhere `
            -latest `
            -products "*" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsInstall) {
            throw "Visual Studio C++ installation was not found"
          }

          $devShell = Join-Path `
            $vsInstall `
            "Common7\Tools\Microsoft.VisualStudio.DevShell.dll"

          Import-Module $devShell

          Enter-VsDevShell `
            -VsInstallPath $vsInstall `
            -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -host_arch=x64"

          $cl = Get-Command cl.exe -ErrorAction Stop
          "MSVC_PATH=$($cl.Source)" >> $env:GITHUB_ENV

      - name: Build OpenVR Garry's Mod module
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path `
            $env:GITHUB_WORKSPACE `
            "src\openvr-module\src\vrmod.cpp"

          $deps = Join-Path `
            $env:GITHUB_WORKSPACE `
            "src\openvr-module\deps"

          $openvrLib = Join-Path `
            $env:GITHUB_WORKSPACE `
            "src\openvr-sdk\lib\win64"

          $work = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build\openvr-windows"

          $outputDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "out"

          $output = Join-Path `
            $outputDirectory `
            "gmcl_vrmod_win64.dll"

          New-Item -ItemType Directory -Path $work -Force | Out-Null
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null

          Push-Location $work

          try {
            $arguments = @(
              "/nologo",
              "/LD",
              "/MT",
              "/O2",
              "/W3",
              "/wd4996",
              "/I$deps",
              $source,
              "/link",
              "/INCREMENTAL:NO",
              "/OPT:REF",
              "d3d11.lib",
              "user32.lib",
              "shell32.lib",
              "/LIBPATH:$openvrLib",
              "openvr_api.lib",
              "/OUT:$output"
            )

            & $env:MSVC_PATH @arguments

            if ($LASTEXITCODE -ne 0) {
              throw "OpenVR module build failed: $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

      - name: Build OpenXR loader
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path $env:GITHUB_WORKSPACE "src\openxr-sdk"
          $build = Join-Path $env:GITHUB_WORKSPACE "build\openxr-windows"
          $output = Join-Path $env:GITHUB_WORKSPACE "out"

          $configure = @(
            "-S", $source,
            "-B", $build,
            "-A", "x64",
            "-DBUILD_TESTS=OFF",
            "-DBUILD_CONFORMANCE_TESTS=OFF",
            "-DBUILD_API_LAYERS=OFF"
          )

          & cmake @configure

          if ($LASTEXITCODE -ne 0) {
            throw "OpenXR CMake configuration failed: $LASTEXITCODE"
          }

          $buildArguments = @(
            "--build", $build,
            "--config", "Release",
            "--target", "openxr_loader",
            "--parallel", "2"
          )

          & cmake @buildArguments

          if ($LASTEXITCODE -ne 0) {
            throw "OpenXR loader build failed: $LASTEXITCODE"
          }

          $loader = Get-ChildItem `
            -LiteralPath $build `
            -Recurse `
            -File `
            -Filter "openxr_loader.dll" |
            Select-Object -First 1

          if (-not $loader) {
            throw "openxr_loader.dll was not generated"
          }

          New-Item -ItemType Directory -Path $output -Force | Out-Null

          Copy-Item `
            -LiteralPath $loader.FullName `
            -Destination (Join-Path $output "openxr_loader.dll") `
            -Force

      - name: Collect Windows modules
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $output = Join-Path $env:GITHUB_WORKSPACE "out"
          $installBin = Join-Path `
            $env:GITHUB_WORKSPACE `
            "src\gvrmod\install\GarrysMod\garrysmod\lua\bin"

          New-Item -ItemType Directory -Path $output -Force | Out-Null

          $gvrmodModule = Get-ChildItem `
            -LiteralPath $installBin `
            -Recurse `
            -File `
            -Filter "gmcl_vrmod_xr_win64.dll" |
            Select-Object -First 1

          if (-not $gvrmodModule) {
            throw "gmcl_vrmod_xr_win64.dll was not generated"
          }

          Copy-Item `
            -LiteralPath $gvrmodModule.FullName `
            -Destination (Join-Path $output "gmcl_vrmod_xr_win64.dll") `
            -Force

          Copy-Item `
            -LiteralPath (
              Join-Path `
                $env:GITHUB_WORKSPACE `
                "src\openvr-sdk\bin\win64\openvr_api.dll"
            ) `
            -Destination (Join-Path $output "openvr_api.dll") `
            -Force

      - name: Validate Windows PE artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Assert-Amd64Pe {
            param(
              [Parameter(Mandatory = $true)]
              [string] $Path
            )

            $bytes = [System.IO.File]::ReadAllBytes($Path)

            if ($bytes.Length -lt 64) {
              throw "$Path is too small to be a PE binary"
            }

            if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
              throw "$Path does not have an MZ header"
            }

            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)

            if ($peOffset -lt 0 -or ($peOffset + 6) -gt $bytes.Length) {
              throw "$Path has an invalid PE header offset"
            }

            if (
              $bytes[$peOffset] -ne 0x50 -or
              $bytes[$peOffset + 1] -ne 0x45 -or
              $bytes[$peOffset + 2] -ne 0x00 -or
              $bytes[$peOffset + 3] -ne 0x00
            ) {
              throw "$Path does not have a valid PE signature"
            }

            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)

            if ($machine -ne 0x8664) {
              throw (
                "{0} is not an AMD64 PE binary (machine=0x{1:X4})" `
                  -f $Path, $machine
              )
            }
          }

          $output = Join-Path $env:GITHUB_WORKSPACE "out"

          $required = @(
            "gmcl_vrmod_xr_win64.dll",
            "gmcl_vrmod_win64.dll",
            "openvr_api.dll",
            "openxr_loader.dll"
          )

          foreach ($name in $required) {
            $path = Join-Path $output $name

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing Windows artifact: $name"
            }

            if ((Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Windows artifact is empty: $name"
            }

            Assert-Amd64Pe -Path $path
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gvrmod-windows-x64
          path: out
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  package:
    name: Package and publish all-in-one.zip
    needs:
      - resolve
      - linux
      - windows

    runs-on: ubuntu-22.04
    timeout-minutes: 20

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout vrmod-x64 addon
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.VRMOD_X64_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.vrmod_x64_sha }}
          path: sources/vrmod-x64
          fetch-depth: 1
          persist-credentials: false

      - name: Download Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gvrmod-linux-x64
          path: artifacts/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gvrmod-windows-x64
          path: artifacts/windows

      - name: Assemble Garry's Mod directory tree
        shell: bash
        run: |
          set -euo pipefail

          stage="$GITHUB_WORKSPACE/stage"
          addon_source="$GITHUB_WORKSPACE/sources/vrmod-x64"
          addon_target="$stage/garrysmod/addons/vrmod-x64"
          lua_bin="$stage/garrysmod/lua/bin"

          rm -rf "$stage"
          mkdir -p \
            "$addon_target" \
            "$lua_bin" \
            "$stage/bin/win64" \
            "$stage/bin/linux64" \
            "$stage/LICENSES"

          install -m 0644 \
            "$addon_source/addon.json" \
            "$addon_target/addon.json"

          for directory in lua materials models; do
            if [[ ! -d "$addon_source/$directory" ]]; then
              echo "::error::Missing addon directory: ${directory}"
              exit 1
            fi

            cp -a \
              "$addon_source/$directory" \
              "$addon_target/$directory"
          done

          # Do not allow stale native binaries from the addon repository to
          # replace the binaries built by this workflow.
          find "$addon_target" \
            -type f \
            \( -iname '*.dll' -o -iname '*.so' -o -iname '*.so.*' \) \
            -delete

          windows_files=(
            gmcl_vrmod_xr_win64.dll
            gmcl_vrmod_win64.dll
            openvr_api.dll
            openxr_loader.dll
          )

          linux_files=(
            gmcl_vrmod_xr_linux64.dll
            gmcl_vrmod_linux64.dll
            gmcl_vrmod_quest_linux64.dll
            libopenvr_api.so
            libopenxr_loader.so
            libopenxr_loader.so.1
          )

          for name in "${windows_files[@]}"; do
            source="$GITHUB_WORKSPACE/artifacts/windows/$name"

            test -s "$source"

            install -m 0644 "$source" "$lua_bin/$name"
            install -m 0644 "$source" "$stage/bin/win64/$name"
          done

          for name in "${linux_files[@]}"; do
            source="$GITHUB_WORKSPACE/artifacts/linux/$name"

            test -s "$source"

            install -m 0644 "$source" "$lua_bin/$name"
            install -m 0644 "$source" "$stage/bin/linux64/$name"
          done

          if [[ ! -d "$GITHUB_WORKSPACE/artifacts/linux/licenses" ]]; then
            echo "::error::License bundle is missing"
            exit 1
          fi

          cp -a \
            "$GITHUB_WORKSPACE/artifacts/linux/licenses/." \
            "$stage/LICENSES/"

      - name: Write build manifest
        shell: bash
        run: |
          set -euo pipefail

          manifest="$GITHUB_WORKSPACE/stage/BUILD-MANIFEST.txt"

          {
            echo "gVRMod=${{ needs.resolve.outputs.gvrmod_sha }}"
            echo "vrmod-module-master=${{ needs.resolve.outputs.openvr_module_sha }}"
            echo "vrmod-x64=${{ needs.resolve.outputs.vrmod_x64_sha }}"
            echo "OpenVR=${{ needs.resolve.outputs.openvr_sdk_sha }}"
            echo "OpenXR-SDK=${{ needs.resolve.outputs.openxr_sdk_sha }}"
            echo "builder=${GITHUB_REPOSITORY}@${GITHUB_SHA}"
            echo "workflow-run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "built-at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > "$manifest"

      - name: Validate package tree
        shell: bash
        run: |
          set -euo pipefail

          stage="$GITHUB_WORKSPACE/stage"

          required=(
            garrysmod/addons/vrmod-x64/addon.json
            garrysmod/lua/bin/gmcl_vrmod_xr_win64.dll
            garrysmod/lua/bin/gmcl_vrmod_win64.dll
            garrysmod/lua/bin/openvr_api.dll
            garrysmod/lua/bin/openxr_loader.dll
            garrysmod/lua/bin/gmcl_vrmod_xr_linux64.dll
            garrysmod/lua/bin/gmcl_vrmod_linux64.dll
            garrysmod/lua/bin/gmcl_vrmod_quest_linux64.dll
            garrysmod/lua/bin/libopenvr_api.so
            garrysmod/lua/bin/libopenxr_loader.so
            garrysmod/lua/bin/libopenxr_loader.so.1
            bin/win64/gmcl_vrmod_xr_win64.dll
            bin/win64/gmcl_vrmod_win64.dll
            bin/win64/openvr_api.dll
            bin/win64/openxr_loader.dll
            bin/linux64/gmcl_vrmod_xr_linux64.dll
            bin/linux64/gmcl_vrmod_linux64.dll
            bin/linux64/gmcl_vrmod_quest_linux64.dll
            bin/linux64/libopenvr_api.so
            bin/linux64/libopenxr_loader.so
            bin/linux64/libopenxr_loader.so.1
            BUILD-MANIFEST.txt
          )

          for relative_path in "${required[@]}"; do
            if [[ ! -s "$stage/$relative_path" ]]; then
              echo "::error::Missing or empty package file: ${relative_path}"
              exit 1
            fi
          done

          forbidden="$(
            find "$stage" \
              -type f \
              \( \
                -iname '*.sh' \
                -o -iname '*.bash' \
                -o -iname '*.bat' \
                -o -iname '*.cmd' \
                -o -iname '*.ps1' \
                -o -iname '*.exe' \
              \) \
              -print \
              -quit
          )"

          if [[ -n "$forbidden" ]]; then
            echo "::error file=${forbidden}::Forbidden script or executable in package"
            exit 1
          fi

          symlink="$(
            find "$stage" \
              -type l \
              -print \
              -quit
          )"

          if [[ -n "$symlink" ]]; then
            echo "::error file=${symlink}::Symlinks are not allowed in the cross-platform ZIP"
            exit 1
          fi

      - name: Create all-in-one.zip
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$GITHUB_WORKSPACE/all-in-one.zip"

          (
            cd "$GITHUB_WORKSPACE/stage"
            zip -X -9 -r "$GITHUB_WORKSPACE/all-in-one.zip" .
          )

          test -s "$GITHUB_WORKSPACE/all-in-one.zip"

      - name: Validate ZIP contents
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile

          archive = "all-in-one.zip"

          required = {
              "garrysmod/addons/vrmod-x64/addon.json",
              "garrysmod/lua/bin/gmcl_vrmod_xr_win64.dll",
              "garrysmod/lua/bin/gmcl_vrmod_win64.dll",
              "garrysmod/lua/bin/openvr_api.dll",
              "garrysmod/lua/bin/openxr_loader.dll",
              "garrysmod/lua/bin/gmcl_vrmod_xr_linux64.dll",
              "garrysmod/lua/bin/gmcl_vrmod_linux64.dll",
              "garrysmod/lua/bin/gmcl_vrmod_quest_linux64.dll",
              "garrysmod/lua/bin/libopenvr_api.so",
              "garrysmod/lua/bin/libopenxr_loader.so",
              "garrysmod/lua/bin/libopenxr_loader.so.1",
              "BUILD-MANIFEST.txt",
          }

          forbidden_suffixes = (
              ".sh",
              ".bash",
              ".bat",
              ".cmd",
              ".ps1",
              ".exe",
          )

          with ZipFile(archive) as zip_file:
              infos = zip_file.infolist()
              names = [info.filename for info in infos]
              files = {
                  info.filename
                  for info in infos
                  if not info.is_dir()
              }

              if len(names) != len(set(names)):
                  raise SystemExit("ZIP contains duplicate paths")

              for name in names:
                  path = PurePosixPath(name)

                  if name.startswith("/") or "\\" in name:
                      raise SystemExit(f"Unsafe ZIP path: {name}")

                  if ".." in path.parts:
                      raise SystemExit(f"Unsafe ZIP traversal path: {name}")

                  if not (
                      name.startswith("garrysmod/")
                      or name.startswith("bin/")
                      or name.startswith("LICENSES/")
                      or name == "BUILD-MANIFEST.txt"
                  ):
                      raise SystemExit(f"Unexpected top-level ZIP path: {name}")

                  if name.lower().endswith(forbidden_suffixes):
                      raise SystemExit(f"Forbidden packaged file: {name}")

              missing = sorted(required - files)

              if missing:
                  raise SystemExit(
                      "ZIP is missing required files:\n"
                      + "\n".join(missing)
                  )

          print("all-in-one.zip validation passed")
          PY

          sha256sum all-in-one.zip

      - name: Upload all-in-one workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: all-in-one
          path: all-in-one.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Replace nightly release
        shell: bash
        run: |
          set -euo pipefail

          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly \
              --cleanup-tag \
              --yes
          fi

          gh release create nightly \
            "$GITHUB_WORKSPACE/all-in-one.zip#all-in-one.zip" \
            --target "$GITHUB_SHA" \
            --title "gVRMod nightly" \
            --notes "Automated Windows/Wine and Linux x86-64 all-in-one build. Extract directly into the GarrysMod installation directory. Exact source revisions are recorded inside BUILD-MANIFEST.txt." \
            --prerelease \
            --latest=false
