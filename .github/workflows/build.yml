name: Build nightly all-in-one

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 0"

permissions:
  contents: read

concurrency:
  group: gvrmod-nightly
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

  GVRMOD_REPOSITORY: Abyss-c0re/gVRMod
  OPENVR_MODULE_REPOSITORY: Abyss-c0re/vrmod-module-master
  VRMOD_X64_REPOSITORY: Abyss-c0re/vrmod-x64

  OPENVR_REPOSITORY: ValveSoftware/openvr
  OPENVR_VERSION: "2.15.6"
  OPENVR_REF: 0924064316de3effbcd1acf1e309182a2deb1c05

  OPENXR_SDK_REPOSITORY: KhronosGroup/OpenXR-SDK
  OPENXR_SDK_VERSION: "1.1.61"
  OPENXR_SDK_REF: 5267613edf3d937e3d77556a106a65c2f82b25c6

jobs:
  resolve:
    name: Resolve immutable revisions
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      gvrmod_sha: ${{ steps.resolve.outputs.gvrmod_sha }}
      openvr_module_sha: ${{ steps.resolve.outputs.openvr_module_sha }}
      vrmod_x64_sha: ${{ steps.resolve.outputs.vrmod_x64_sha }}
      openvr_sha: ${{ steps.resolve.outputs.openvr_sha }}
      openxr_sdk_sha: ${{ steps.resolve.outputs.openxr_sdk_sha }}

    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          check-latest: false
          package-manager-cache: false

      - name: Verify Node.js
        shell: bash
        run: |
          set -euo pipefail

          node --version
          node -e "
            if (Number(process.versions.node.split('.')[0]) !== 24) {
              process.exit(1);
            }
          "

      - name: Resolve source commits
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          resolve_sha() {
            local repository="$1"
            local ref="$2"
            local sha

            sha="$(
              gh api \
                "repos/${repository}/commits/${ref}" \
                --jq '.sha'
            )"

            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Could not resolve ${repository}@${ref}"
              return 1
            fi

            printf '%s\n' "$sha"
          }

          gvrmod_sha="$(
            resolve_sha "$GVRMOD_REPOSITORY" main
          )"

          openvr_module_sha="$(
            resolve_sha "$OPENVR_MODULE_REPOSITORY" main
          )"

          openvr_sha="$(
            resolve_sha "$OPENVR_REPOSITORY" "$OPENVR_REF"
          )"

          openxr_sdk_sha="$(
            resolve_sha "$OPENXR_SDK_REPOSITORY" "$OPENXR_SDK_REF"
          )"

          if [[ "$openvr_sha" != "$OPENVR_REF" ]]; then
            echo "::error::OpenVR commit differs from the pinned revision"
            exit 1
          fi

          if [[ "$openxr_sdk_sha" != "$OPENXR_SDK_REF" ]]; then
            echo "::error::OpenXR SDK commit differs from the pinned revision"
            exit 1
          fi

          gvrmod_tree_sha="$(
            gh api \
              "repos/${GVRMOD_REPOSITORY}/git/commits/${gvrmod_sha}" \
              --jq '.tree.sha'
          )"

          vrmod_x64_sha="$(
            gh api \
              "repos/${GVRMOD_REPOSITORY}/git/trees/${gvrmod_tree_sha}?recursive=1" \
              --jq '
                .tree[]
                | select(
                    .path == "addon/vrmod-x64"
                    and .mode == "160000"
                    and .type == "commit"
                  )
                | .sha
              '
          )"

          if [[ ! "$vrmod_x64_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::gVRMod addon/vrmod-x64 gitlink was not found"
            exit 1
          fi

          resolved_vrmod_x64="$(
            resolve_sha "$VRMOD_X64_REPOSITORY" "$vrmod_x64_sha"
          )"

          if [[ "$resolved_vrmod_x64" != "$vrmod_x64_sha" ]]; then
            echo "::error::vrmod-x64 gitlink is not a valid commit"
            exit 1
          fi

          {
            echo "gvrmod_sha=$gvrmod_sha"
            echo "openvr_module_sha=$openvr_module_sha"
            echo "vrmod_x64_sha=$vrmod_x64_sha"
            echo "openvr_sha=$openvr_sha"
            echo "openxr_sdk_sha=$openxr_sdk_sha"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Resolved revisions"
            echo
            echo "- gVRMod: \`$gvrmod_sha\`"
            echo "- vrmod-module-master: \`$openvr_module_sha\`"
            echo "- vrmod-x64 gitlink: \`$vrmod_x64_sha\`"
            echo "- OpenVR ${OPENVR_VERSION}: \`$openvr_sha\`"
            echo "- OpenXR SDK ${OPENXR_SDK_VERSION}: \`$openxr_sdk_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-linux:
    name: Build Linux modules
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          check-latest: false
          package-manager-cache: false

      - name: Check out gVRMod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.GVRMOD_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.gvrmod_sha }}
          path: src/gvrmod
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact vrmod-x64 gitlink
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.VRMOD_X64_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.vrmod_x64_sha }}
          path: src/gvrmod/addon/vrmod-x64
          fetch-depth: 1
          persist-credentials: false

      - name: Check out OpenVR module repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.OPENVR_MODULE_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.openvr_module_sha }}
          path: src/openvr-module
          fetch-depth: 1
          persist-credentials: false

      - name: Check out official OpenVR library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.OPENVR_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.openvr_sha }}
          path: src/openvr-sdk
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            bin/linux64/libopenvr_api.so
            LICENSE

      - name: Check out OpenXR SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.OPENXR_SDK_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.openxr_sdk_sha }}
          path: src/openxr-sdk
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install \
            --yes \
            --no-install-recommends \
            build-essential \
            binutils \
            cmake \
            file \
            libgl1-mesa-dev \
            libvulkan-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxxf86vm-dev \
            lua5.1 \
            ninja-build \
            python3 \
            unzip \
            zip

      - name: Verify Linux source layout
        shell: bash
        run: |
          set -euo pipefail

          test -f src/gvrmod/CMakeLists.txt
          test -f src/gvrmod/addon/vrmod-x64/addon.json

          test -f \
            src/openvr-module/deps/gmod/Interface.h

          test -s \
            src/openvr-module/install/GarrysMod/garrysmod/lua/bin/gmcl_vrmod_linux64.dll

          test -s \
            src/openvr-sdk/bin/linux64/libopenvr_api.so

          test -f src/openxr-sdk/CMakeLists.txt
          test -f src/openxr-sdk/include/openxr/openxr.h
          test -f src/openxr-sdk/src/external/jsoncpp/LICENSE

      - name: Prepare gVRMod dependencies
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            src/gvrmod/deps/gmod \
            src/gvrmod/deps/openxr/openxr

          mkdir -p \
            src/gvrmod/deps \
            src/gvrmod/deps/openxr/openxr

          cp -a \
            src/openvr-module/deps/gmod \
            src/gvrmod/deps/gmod

          cp -a \
            src/openxr-sdk/include/openxr/. \
            src/gvrmod/deps/openxr/openxr/

      - name: Build gVRMod Linux modules
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S src/gvrmod \
            -B build/gvrmod-linux \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVRMOD_BUILD_TESTS=ON \
            -DVRMOD_BUILD_QUEST=ON

          cmake \
            --build build/gvrmod-linux \
            --parallel 2

      - name: Run native Linux tests
        shell: bash
        run: |
          set -euo pipefail

          test -x build/gvrmod-linux/vrmod_tests
          ./build/gvrmod-linux/vrmod_tests

      - name: Run Lua tests
        shell: bash
        working-directory: src/gvrmod
        env:
          GVRMOD_ROOT: ${{ github.workspace }}/src/gvrmod/
        run: |
          set -euo pipefail

          python3 scripts/gen_contracts.py
          python3 scripts/check_test_contracts.py
          lua5.1 tests/lua/run.lua
          lua5.1 tests/scenarios/run.lua

      - name: Build and install OpenXR Linux loader
        shell: bash
        run: |
          set -euo pipefail

          install_prefix="$GITHUB_WORKSPACE/dist/openxr-linux-install"

          cmake \
            -S src/openxr-sdk \
            -B build/openxr-linux \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$install_prefix" \
            -DCMAKE_INSTALL_BINDIR=bin \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_LOADER=ON \
            -DDYNAMIC_LOADER=ON \
            -DBUILD_ALL_EXTENSIONS=OFF \
            -DBUILD_API_LAYERS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_CONFORMANCE_TESTS=OFF \
            -DBUILD_SDK_TESTS=OFF \
            -DBUILD_WITH_SYSTEM_JSONCPP=OFF \
            -DINSTALL_SYMBOLS=OFF

          cmake \
            --build build/openxr-linux \
            --target openxr_loader \
            --parallel 2

          cmake \
            --install build/openxr-linux \
            --component Loader

          installed_loader="$install_prefix/lib/libopenxr_loader.so"

          if [[ ! -e "$installed_loader" ]]; then
            echo "::error::Installed OpenXR Linux loader was not found"
            exit 1
          fi

          file "$installed_loader"

      - name: Collect Linux binaries and licenses
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            dist/linux/bin \
            dist/linux/licenses/OpenXR-SDK

          xr_module="$(
            find \
              src/gvrmod/install/GarrysMod/garrysmod/lua/bin \
              -type f \
              -name 'gmcl_vrmod_xr_linux64.dll' \
              -print \
              -quit
          )"

          quest_module="$(
            find \
              src/gvrmod/install/GarrysMod/garrysmod/lua/bin \
              -type f \
              -name 'gmcl_vrmod_quest_linux64.dll' \
              -print \
              -quit
          )"

          openxr_loader="dist/openxr-linux-install/lib/libopenxr_loader.so"

          test -n "$xr_module"
          test -n "$quest_module"
          test -e "$openxr_loader"

          install -m 0755 \
            src/openvr-module/install/GarrysMod/garrysmod/lua/bin/gmcl_vrmod_linux64.dll \
            dist/linux/bin/gmcl_vrmod_linux64.dll

          install -m 0755 \
            "$xr_module" \
            dist/linux/bin/gmcl_vrmod_xr_linux64.dll

          install -m 0755 \
            "$quest_module" \
            dist/linux/bin/gmcl_vrmod_quest_linux64.dll

          install -m 0755 \
            src/openvr-sdk/bin/linux64/libopenvr_api.so \
            dist/linux/bin/libopenvr_api.so

          # install dereferences the SDK symlink and creates regular package files.
          install -m 0755 \
            "$openxr_loader" \
            dist/linux/bin/libopenxr_loader.so

          install -m 0755 \
            "$openxr_loader" \
            dist/linux/bin/libopenxr_loader.so.1

          install -m 0644 \
            src/gvrmod/LICENSE \
            dist/linux/licenses/gVRMod-LICENSE

          install -m 0644 \
            src/openvr-module/LICENSE \
            dist/linux/licenses/vrmod-module-master-LICENSE

          install -m 0644 \
            src/openvr-sdk/LICENSE \
            dist/linux/licenses/OpenVR-LICENSE

          install -m 0644 \
            src/openxr-sdk/LICENSE \
            dist/linux/licenses/OpenXR-SDK/LICENSE

          install -m 0644 \
            src/openxr-sdk/COPYING.adoc \
            dist/linux/licenses/OpenXR-SDK/COPYING.adoc

          install -m 0644 \
            src/openxr-sdk/src/external/jsoncpp/LICENSE \
            dist/linux/licenses/OpenXR-SDK/jsoncpp-LICENSE

          cp -a \
            src/openxr-sdk/LICENSES \
            dist/linux/licenses/OpenXR-SDK/LICENSES

      - name: Validate Linux binaries
        shell: bash
        run: |
          set -euo pipefail

          require_elf_x86_64() {
            local binary="$1"
            local description

            description="$(file -b "$binary")"

            if [[ "$description" != *"ELF 64-bit LSB"* ]] ||
               [[ "$description" != *"x86-64"* ]]; then
              echo "::error file=${binary}::Expected ELF x86-64: ${description}"
              return 1
            fi
          }

          require_export() {
            local binary="$1"
            local symbol="$2"
            local exports

            exports="$(
              nm -D --defined-only "$binary" |
                awk '{print $NF}' |
                sed 's/@.*$//'
            )"

            if ! grep -Fx "$symbol" <<< "$exports" >/dev/null; then
              echo "::error file=${binary}::Missing export ${symbol}"
              return 1
            fi
          }

          while IFS= read -r binary; do
            require_elf_x86_64 "$binary"
          done < <(
            find dist/linux/bin -maxdepth 1 -type f -print
          )

          require_export \
            dist/linux/bin/gmcl_vrmod_linux64.dll \
            gmod13_open

          require_export \
            dist/linux/bin/gmcl_vrmod_linux64.dll \
            gmod13_close

          require_export \
            dist/linux/bin/gmcl_vrmod_xr_linux64.dll \
            gmod13_open

          require_export \
            dist/linux/bin/gmcl_vrmod_xr_linux64.dll \
            gmod13_close

          require_export \
            dist/linux/bin/gmcl_vrmod_quest_linux64.dll \
            gmod13_open

          require_export \
            dist/linux/bin/gmcl_vrmod_quest_linux64.dll \
            gmod13_close

          require_export \
            dist/linux/bin/libopenvr_api.so \
            VR_InitInternal

          require_export \
            dist/linux/bin/libopenvr_api.so \
            VR_GetGenericInterface

          require_export \
            dist/linux/bin/libopenxr_loader.so \
            xrGetInstanceProcAddr

          while IFS= read -r binary; do
            dependencies="$(
              LD_LIBRARY_PATH="$PWD/dist/linux/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
                ldd "$binary" 2>&1
            )"

            printf '%s\n' "$dependencies"

            if grep -F "not found" <<< "$dependencies"; then
              echo "::error file=${binary}::Unresolved Linux dependency"
              exit 1
            fi
          done < <(
            find dist/linux/bin -maxdepth 1 -type f -print
          )

      - name: Upload Linux artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-linux
          path: |
            dist/linux/bin
            dist/linux/licenses
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false

  build-windows:
    name: Build Windows and Wine modules
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          check-latest: false
          package-manager-cache: false

      - name: Check out gVRMod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.GVRMOD_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.gvrmod_sha }}
          path: src/gvrmod
          fetch-depth: 1
          persist-credentials: false

      - name: Check out OpenVR module repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.OPENVR_MODULE_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.openvr_module_sha }}
          path: src/openvr-module
          fetch-depth: 1
          persist-credentials: false

      - name: Check out official OpenVR library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.OPENVR_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.openvr_sha }}
          path: src/openvr-sdk
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            bin/win64/openvr_api.dll
            LICENSE

      - name: Check out OpenXR SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.OPENXR_SDK_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.openxr_sdk_sha }}
          path: src/openxr-sdk
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Verify Windows source layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "src/gvrmod/CMakeLists.txt",
            "src/openvr-module/deps/gmod/Interface.h",
            "src/openvr-module/install/GarrysMod/garrysmod/lua/bin/gmcl_vrmod_win64.dll",
            "src/openvr-sdk/bin/win64/openvr_api.dll",
            "src/openxr-sdk/CMakeLists.txt",
            "src/openxr-sdk/include/openxr/openxr.h",
            "src/openxr-sdk/src/external/jsoncpp/LICENSE"
          )

          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required source file is missing: $path"
            }
          }

      - name: Prepare gVRMod dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item `
            -LiteralPath "src/gvrmod/deps/gmod" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            -LiteralPath "src/gvrmod/deps/openxr/openxr" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path "src/gvrmod/deps" `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path "src/gvrmod/deps/openxr/openxr" `
            -Force | Out-Null

          Copy-Item `
            -LiteralPath "src/openvr-module/deps/gmod" `
            -Destination "src/gvrmod/deps/gmod" `
            -Recurse `
            -Force

          Copy-Item `
            -Path "src/openxr-sdk/include/openxr/*.h" `
            -Destination "src/gvrmod/deps/openxr/openxr" `
            -Force

          New-Item `
            -ItemType Directory `
            -Path "build" `
            -Force | Out-Null

          $shim = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build/gvrmod-msvc-shim.h"

          @'
          #pragma once
          #ifdef _WIN32
          using GLuint = unsigned int;
          #endif
          '@ | Set-Content `
            -LiteralPath $shim `
            -Encoding utf8NoBOM

          "GVRMOD_MSVC_SHIM=$shim" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Build gVRMod Windows OpenXR module
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $env:CL = "/FI`"$env:GVRMOD_MSVC_SHIM`""

          $configure = @(
            "-S", "src/gvrmod",
            "-B", "build/gvrmod-windows",
            "-A", "x64",
            "-DVRMOD_BUILD_TESTS=OFF",
            "-DVRMOD_BUILD_QUEST=OFF"
          )

          & cmake @configure

          if ($LASTEXITCODE -ne 0) {
            throw "gVRMod CMake configuration failed: $LASTEXITCODE"
          }

          & cmake `
            --build build/gvrmod-windows `
            --config Release `
            --target vrmod_release `
            --parallel 2

          if ($LASTEXITCODE -ne 0) {
            throw "gVRMod build failed: $LASTEXITCODE"
          }

          Remove-Item Env:CL -ErrorAction SilentlyContinue

      - name: Build and install Windows OpenXR loader
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installPrefix = Join-Path `
            $env:GITHUB_WORKSPACE `
            "dist/openxr-windows-install"

          $configure = @(
            "-S", "src/openxr-sdk",
            "-B", "build/openxr-windows",
            "-A", "x64",
            "-DCMAKE_INSTALL_PREFIX=$installPrefix",
            "-DCMAKE_INSTALL_BINDIR=bin",
            "-DCMAKE_INSTALL_LIBDIR=lib",
            "-DBUILD_LOADER=ON",
            "-DDYNAMIC_LOADER=ON",
            "-DBUILD_ALL_EXTENSIONS=OFF",
            "-DBUILD_API_LAYERS=OFF",
            "-DBUILD_TESTS=OFF",
            "-DBUILD_CONFORMANCE_TESTS=OFF",
            "-DBUILD_SDK_TESTS=OFF",
            "-DBUILD_WITH_SYSTEM_JSONCPP=OFF",
            "-DINSTALL_SYMBOLS=OFF"
          )

          & cmake @configure

          if ($LASTEXITCODE -ne 0) {
            throw "OpenXR loader CMake configuration failed: $LASTEXITCODE"
          }

          & cmake `
            --build build/openxr-windows `
            --config Release `
            --target openxr_loader `
            --parallel 2

          if ($LASTEXITCODE -ne 0) {
            throw "OpenXR loader build failed: $LASTEXITCODE"
          }

          # Khronos produces four build-tree copies with Visual Studio:
          # one target output and three client/test copies. The install
          # component selects the canonical target deterministically.
          & cmake `
            --install build/openxr-windows `
            --config Release `
            --component Loader

          if ($LASTEXITCODE -ne 0) {
            throw "OpenXR loader installation failed: $LASTEXITCODE"
          }

          $installedLoader = Join-Path `
            $installPrefix `
            "bin/openxr_loader.dll"

          if (-not (Test-Path -LiteralPath $installedLoader -PathType Leaf)) {
            throw "Installed OpenXR loader was not found: $installedLoader"
          }

          $item = Get-Item -LiteralPath $installedLoader

          if ($item.Length -le 0) {
            throw "Installed OpenXR loader is empty: $installedLoader"
          }

          Write-Host "Canonical OpenXR loader: $($item.FullName)"
          Write-Host "Size: $($item.Length) bytes"

      - name: Collect Windows and Wine binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Path "dist/windows/bin" `
            -Force | Out-Null

          $xrModules = @(
            Get-ChildItem `
              -LiteralPath "src/gvrmod/install" `
              -Recurse `
              -File `
              -Filter "gmcl_vrmod_xr_win64.dll"
          )

          if ($xrModules.Count -ne 1) {
            throw "Expected one gmcl_vrmod_xr_win64.dll, found $($xrModules.Count)"
          }

          # Do not search build/openxr-windows recursively. Khronos creates
          # four valid copies there by design. Use only the installed target.
          $openxrLoader = Join-Path `
            $env:GITHUB_WORKSPACE `
            "dist/openxr-windows-install/bin/openxr_loader.dll"

          if (-not (Test-Path -LiteralPath $openxrLoader -PathType Leaf)) {
            throw "Canonical installed openxr_loader.dll was not found: $openxrLoader"
          }

          Copy-Item `
            -LiteralPath "src/openvr-module/install/GarrysMod/garrysmod/lua/bin/gmcl_vrmod_win64.dll" `
            -Destination "dist/windows/bin/gmcl_vrmod_win64.dll" `
            -Force

          Copy-Item `
            -LiteralPath $xrModules[0].FullName `
            -Destination "dist/windows/bin/gmcl_vrmod_xr_win64.dll" `
            -Force

          Copy-Item `
            -LiteralPath "src/openvr-sdk/bin/win64/openvr_api.dll" `
            -Destination "dist/windows/bin/openvr_api.dll" `
            -Force

          Copy-Item `
            -LiteralPath $openxrLoader `
            -Destination "dist/windows/bin/openxr_loader.dll" `
            -Force

          $expected = @(
            "dist/windows/bin/gmcl_vrmod_win64.dll",
            "dist/windows/bin/gmcl_vrmod_xr_win64.dll",
            "dist/windows/bin/openvr_api.dll",
            "dist/windows/bin/openxr_loader.dll"
          )

          foreach ($binary in $expected) {
            $item = Get-Item -LiteralPath $binary

            if ($item.Length -le 0) {
              throw "Collected binary is empty: $binary"
            }

            Write-Host "$binary ($($item.Length) bytes)"
          }

      - name: Initialize Visual Studio tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = Join-Path `
            ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio/Installer/vswhere.exe"

          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe was not found"
          }

          $vsPath = & $vswhere `
            -latest `
            -products "*" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (
            $LASTEXITCODE -ne 0 -or
            [string]::IsNullOrWhiteSpace($vsPath)
          ) {
            throw "Visual Studio C++ installation was not found"
          }

          $devShell = Join-Path `
            $vsPath `
            "Common7/Tools/Microsoft.VisualStudio.DevShell.dll"

          Import-Module $devShell

          Enter-VsDevShell `
            -VsInstallPath $vsPath `
            -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -host_arch=x64"

          if (-not (Get-Command dumpbin.exe -ErrorAction SilentlyContinue)) {
            throw "dumpbin.exe was not initialized"
          }

          "VS_INSTALL_PATH=$vsPath" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Validate Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $devShell = Join-Path `
            $env:VS_INSTALL_PATH `
            "Common7/Tools/Microsoft.VisualStudio.DevShell.dll"

          Import-Module $devShell

          Enter-VsDevShell `
            -VsInstallPath $env:VS_INSTALL_PATH `
            -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -host_arch=x64"

          function Assert-PeAmd64 {
            param(
              [Parameter(Mandatory)]
              [string]$Path
            )

            $bytes = [System.IO.File]::ReadAllBytes($Path)

            if ($bytes.Length -lt 64) {
              throw "$Path is too small to be a PE binary"
            }

            if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
              throw "$Path does not have an MZ header"
            }

            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)

            if (
              $peOffset -lt 0 -or
              ($peOffset + 6) -gt $bytes.Length
            ) {
              throw "$Path has an invalid PE header offset"
            }

            if (
              $bytes[$peOffset] -ne 0x50 -or
              $bytes[$peOffset + 1] -ne 0x45 -or
              $bytes[$peOffset + 2] -ne 0x00 -or
              $bytes[$peOffset + 3] -ne 0x00
            ) {
              throw "$Path does not have a valid PE signature"
            }

            $machine = [BitConverter]::ToUInt16(
              $bytes,
              $peOffset + 4
            )

            if ($machine -ne 0x8664) {
              $value = "{0:X4}" -f $machine
              throw "$Path is not AMD64; PE machine is 0x$value"
            }
          }

          function Get-DumpbinOutput {
            param(
              [Parameter(Mandatory)]
              [string]$Mode,

              [Parameter(Mandatory)]
              [string]$Path
            )

            $result = & dumpbin.exe `
              /nologo `
              $Mode `
              $Path 2>&1 | Out-String

            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin $Mode failed for $Path"
            }

            return $result
          }

          function Assert-Export {
            param(
              [Parameter(Mandatory)]
              [string]$Path,

              [Parameter(Mandatory)]
              [string]$Symbol
            )

            $exports = Get-DumpbinOutput `
              -Mode "/exports" `
              -Path $Path

            $pattern = "(?m)\b$([Regex]::Escape($Symbol))\b"

            if ($exports -notmatch $pattern) {
              throw "$Path does not export $Symbol"
            }
          }

          $legacyModule = "dist/windows/bin/gmcl_vrmod_win64.dll"
          $xrModule = "dist/windows/bin/gmcl_vrmod_xr_win64.dll"
          $openvrLoader = "dist/windows/bin/openvr_api.dll"
          $openxrLoader = "dist/windows/bin/openxr_loader.dll"

          foreach ($binary in @(
            $legacyModule,
            $xrModule,
            $openvrLoader,
            $openxrLoader
          )) {
            Assert-PeAmd64 -Path $binary
          }

          Assert-Export `
            -Path $legacyModule `
            -Symbol "gmod13_open"

          Assert-Export `
            -Path $legacyModule `
            -Symbol "gmod13_close"

          Assert-Export `
            -Path $xrModule `
            -Symbol "gmod13_open"

          Assert-Export `
            -Path $xrModule `
            -Symbol "gmod13_close"

          Assert-Export `
            -Path $openvrLoader `
            -Symbol "VR_InitInternal"

          Assert-Export `
            -Path $openvrLoader `
            -Symbol "VR_GetGenericInterface"

          Assert-Export `
            -Path $openxrLoader `
            -Symbol "xrGetInstanceProcAddr"

          $legacyDependencies = Get-DumpbinOutput `
            -Mode "/dependents" `
            -Path $legacyModule

          if ($legacyDependencies -notmatch "(?im)\bopenvr_api\.dll\b") {
            throw "gmcl_vrmod_win64.dll does not import openvr_api.dll"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-windows
          path: dist/windows/bin
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false

  package:
    name: Package and publish all-in-one.zip
    needs:
      - resolve
      - build-linux
      - build-windows

    runs-on: ubuntu-24.04
    timeout-minutes: 25

    permissions:
      actions: read
      contents: write

    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          check-latest: false
          package-manager-cache: false

      - name: Check out exact vrmod-x64 addon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.VRMOD_X64_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.vrmod_x64_sha }}
          path: src/vrmod-x64
          fetch-depth: 1
          persist-credentials: false

      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-linux
          path: artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-windows
          path: artifacts/windows

      - name: Assemble direct-extraction tree
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            staging \
            all-in-one.zip \
            all-in-one.zip.sha256

          addon_root="staging/garrysmod/addons/vrmod-x64"
          lua_bin="staging/garrysmod/lua/bin"

          mkdir -p \
            "$addon_root" \
            "$lua_bin" \
            staging/bin/win64 \
            staging/bin/linux64 \
            staging/LICENSES

          for item in addon.json lua materials models; do
            if [[ ! -e "src/vrmod-x64/$item" ]]; then
              echo "::error::Required addon item is missing: $item"
              exit 1
            fi

            cp -a \
              "src/vrmod-x64/$item" \
              "$addon_root/"
          done

          install -m 0644 \
            src/vrmod-x64/LICENSE \
            staging/LICENSES/vrmod-x64-LICENSE

          cp -a \
            artifacts/linux/bin/. \
            "$lua_bin/"

          cp -a \
            artifacts/windows/. \
            "$lua_bin/"

          cp -a \
            artifacts/linux/licenses/. \
            staging/LICENSES/

          # Garry's Mod, Source and Wine compatibility locations.
          install -m 0644 \
            "$lua_bin/openvr_api.dll" \
            staging/bin/openvr_api.dll

          install -m 0644 \
            "$lua_bin/openvr_api.dll" \
            staging/bin/win64/openvr_api.dll

          install -m 0644 \
            "$lua_bin/openxr_loader.dll" \
            staging/bin/openxr_loader.dll

          install -m 0644 \
            "$lua_bin/openxr_loader.dll" \
            staging/bin/win64/openxr_loader.dll

          install -m 0755 \
            "$lua_bin/libopenvr_api.so" \
            staging/bin/libopenvr_api.so

          install -m 0755 \
            "$lua_bin/libopenvr_api.so" \
            staging/bin/linux64/libopenvr_api.so

          install -m 0755 \
            "$lua_bin/libopenxr_loader.so" \
            staging/bin/libopenxr_loader.so

          install -m 0755 \
            "$lua_bin/libopenxr_loader.so.1" \
            staging/bin/libopenxr_loader.so.1

          install -m 0755 \
            "$lua_bin/libopenxr_loader.so" \
            staging/bin/linux64/libopenxr_loader.so

          install -m 0755 \
            "$lua_bin/libopenxr_loader.so.1" \
            staging/bin/linux64/libopenxr_loader.so.1

      - name: Write runtime requirements
        shell: bash
        run: |
          set -euo pipefail

          cat > staging/RUNTIME-REQUIREMENTS.txt <<'EOF'
          gVRMod all-in-one runtime requirements
          =======================================

          Installation
          ------------

          Extract the CONTENTS of all-in-one.zip directly into the GarrysMod
          installation directory.

          Typical Windows location:
            C:\Program Files (x86)\Steam\steamapps\common\GarrysMod

          Typical Linux location:
            ~/.steam/steam/steamapps/common/GarrysMod

          Do not create a separate all-in-one directory inside GarrysMod.

          OpenVR and SteamVR
          ------------------

          SteamVR, Steam application ID 250820, must be installed and running
          when the OpenVR backend is used.

          openvr_api.dll and libopenvr_api.so are official Valve OpenVR client
          libraries. They communicate with the separately installed SteamVR
          runtime.

          SteamVR runtime binaries such as vrclient, vrserver, vrcompositor and
          vrmonitor are intentionally not included or redistributed.

          OpenXR
          ------

          The archive includes the official Khronos OpenXR loader. A compatible
          OpenXR runtime must still be installed and registered.

          When SteamVR is used as the OpenXR runtime, select SteamVR as the
          current OpenXR runtime in SteamVR settings.

          Another conformant OpenXR runtime may also be used.

          Windows and Wine obtain the selected runtime through Windows runtime
          registration. Native Linux obtains it through the active OpenXR
          runtime manifest.

          Wine
          ----

          Windows Garry's Mod running through Wine or Proton uses the Windows
          gmcl_vrmod_*_win64.dll modules and Windows loader DLLs.

          No launcher script, batch file, PowerShell script or external helper
          executable is required by this archive.

          Validation limits
          -----------------

          CI checks file formats, x86-64 architectures, exported symbols,
          native dependencies and ZIP layout.

          A final functional smoke test with Garry's Mod, an actual headset and
          the selected VR runtime must be performed on VR hardware.
          EOF

      - name: Write build manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > staging/BUILD-MANIFEST.txt <<EOF
          gVRMod all-in-one nightly
          =========================

          Workflow:
            repository: ${GITHUB_REPOSITORY}
            run_id: ${GITHUB_RUN_ID}
            run_number: ${GITHUB_RUN_NUMBER}
            workflow_commit: ${GITHUB_SHA}

          Sources:
            gVRMod: ${{ needs.resolve.outputs.gvrmod_sha }}
            vrmod-module-master: ${{ needs.resolve.outputs.openvr_module_sha }}
            vrmod-x64 gitlink: ${{ needs.resolve.outputs.vrmod_x64_sha }}

          Runtime interfaces:
            OpenVR version: ${OPENVR_VERSION}
            OpenVR commit: ${{ needs.resolve.outputs.openvr_sha }}
            OpenXR SDK version: ${OPENXR_SDK_VERSION}
            OpenXR SDK commit: ${{ needs.resolve.outputs.openxr_sdk_sha }}

          Build policy:
            gmcl OpenVR modules: Abyss-c0re canonical prebuilt x86-64 binaries
            OpenVR loader: official Valve release
            gmcl OpenXR modules: built from gVRMod source
            OpenXR loader: installed from official Khronos CMake Loader component
            SteamVR runtime: external requirement and not redistributed
            GitHub Actions JavaScript runtime: Node.js 24

          File SHA-256 checksums:
          EOF

          (
            cd staging

            find . \
              -type f \
              ! -name BUILD-MANIFEST.txt \
              -print0 |
              sort -z |
              xargs -0 sha256sum
          ) >> staging/BUILD-MANIFEST.txt

      - name: Reject forbidden files
        shell: bash
        run: |
          set -euo pipefail

          if find staging -type l -print -quit | grep -q .; then
            echo "::error::Symbolic links are not allowed"
            find staging -type l -print
            exit 1
          fi

          if find staging \
            -type f \
            \( \
              -iname '*.sh' -o \
              -iname '*.bat' -o \
              -iname '*.cmd' -o \
              -iname '*.ps1' -o \
              -iname '*.exe' -o \
              -iname '*.appimage' -o \
              -iname '*.lib' -o \
              -iname '*.exp' -o \
              -iname '*.pdb' -o \
              -iname '*.obj' \
            \) \
            -print -quit | grep -q .; then
            echo "::error::Build product, launcher or helper script found"

            find staging \
              -type f \
              \( \
                -iname '*.sh' -o \
                -iname '*.bat' -o \
                -iname '*.cmd' -o \
                -iname '*.ps1' -o \
                -iname '*.exe' -o \
                -iname '*.appimage' -o \
                -iname '*.lib' -o \
                -iname '*.exp' -o \
                -iname '*.pdb' -o \
                -iname '*.obj' \
              \) \
              -print

            exit 1
          fi

          if find staging \
            -type f \
            \( \
              -iname 'vrclient*.dll' -o \
              -iname 'vrclient*.so' -o \
              -iname 'vrserver*' -o \
              -iname 'vrcompositor*' -o \
              -iname 'vrmonitor*' \
            \) \
            -print -quit | grep -q .; then
            echo "::error::SteamVR runtime files must not be redistributed"
            exit 1
          fi

      - name: Create all-in-one.zip
        shell: bash
        run: |
          set -euo pipefail

          find staging \
            -type f \
            -exec chmod u=rw,go=r {} +

          find staging \
            -type d \
            -exec chmod u=rwx,go=rx {} +

          (
            cd staging
            zip -X -9 -r ../all-in-one.zip .
          )

          sha256sum \
            all-in-one.zip \
            > all-in-one.zip.sha256

      - name: Validate all-in-one.zip
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import pathlib
          import stat
          import zipfile

          archive_path = pathlib.Path("all-in-one.zip")

          required = {
              "garrysmod/addons/vrmod-x64/addon.json",
              "garrysmod/lua/bin/gmcl_vrmod_win64.dll",
              "garrysmod/lua/bin/gmcl_vrmod_linux64.dll",
              "garrysmod/lua/bin/gmcl_vrmod_xr_win64.dll",
              "garrysmod/lua/bin/gmcl_vrmod_xr_linux64.dll",
              "garrysmod/lua/bin/gmcl_vrmod_quest_linux64.dll",
              "garrysmod/lua/bin/openvr_api.dll",
              "garrysmod/lua/bin/libopenvr_api.so",
              "garrysmod/lua/bin/openxr_loader.dll",
              "garrysmod/lua/bin/libopenxr_loader.so",
              "garrysmod/lua/bin/libopenxr_loader.so.1",
              "bin/openvr_api.dll",
              "bin/libopenvr_api.so",
              "bin/openxr_loader.dll",
              "bin/libopenxr_loader.so",
              "bin/libopenxr_loader.so.1",
              "bin/win64/openvr_api.dll",
              "bin/win64/openxr_loader.dll",
              "bin/linux64/libopenvr_api.so",
              "bin/linux64/libopenxr_loader.so",
              "bin/linux64/libopenxr_loader.so.1",
              "RUNTIME-REQUIREMENTS.txt",
              "BUILD-MANIFEST.txt",
          }

          forbidden_suffixes = {
              ".sh",
              ".bat",
              ".cmd",
              ".ps1",
              ".exe",
              ".appimage",
              ".lib",
              ".exp",
              ".pdb",
              ".obj",
          }

          forbidden_runtime_names = {
              "vrclient.dll",
              "vrclient_x64.dll",
              "vrserver.exe",
              "vrcompositor.exe",
              "vrmonitor.exe",
          }

          valid_roots = {
              "garrysmod",
              "bin",
              "LICENSES",
              "RUNTIME-REQUIREMENTS.txt",
              "BUILD-MANIFEST.txt",
          }

          identical_pairs = (
              (
                  "garrysmod/lua/bin/openvr_api.dll",
                  "bin/openvr_api.dll",
              ),
              (
                  "garrysmod/lua/bin/openvr_api.dll",
                  "bin/win64/openvr_api.dll",
              ),
              (
                  "garrysmod/lua/bin/libopenvr_api.so",
                  "bin/libopenvr_api.so",
              ),
              (
                  "garrysmod/lua/bin/libopenvr_api.so",
                  "bin/linux64/libopenvr_api.so",
              ),
              (
                  "garrysmod/lua/bin/openxr_loader.dll",
                  "bin/openxr_loader.dll",
              ),
              (
                  "garrysmod/lua/bin/openxr_loader.dll",
                  "bin/win64/openxr_loader.dll",
              ),
              (
                  "garrysmod/lua/bin/libopenxr_loader.so",
                  "bin/libopenxr_loader.so",
              ),
              (
                  "garrysmod/lua/bin/libopenxr_loader.so",
                  "bin/linux64/libopenxr_loader.so",
              ),
              (
                  "garrysmod/lua/bin/libopenxr_loader.so.1",
                  "bin/libopenxr_loader.so.1",
              ),
              (
                  "garrysmod/lua/bin/libopenxr_loader.so.1",
                  "bin/linux64/libopenxr_loader.so.1",
              ),
          )

          with zipfile.ZipFile(archive_path, "r") as archive:
              infos = archive.infolist()
              names = [info.filename for info in infos]

              if len(names) != len(set(names)):
                  raise SystemExit("ZIP contains duplicate member names")

              corrupt_member = archive.testzip()

              if corrupt_member is not None:
                  raise SystemExit(
                      f"Corrupt ZIP member: {corrupt_member}"
                  )

              packaged_files = set()

              for info in infos:
                  name = info.filename

                  if "\\" in name:
                      raise SystemExit(
                          f"Backslash in ZIP path: {name}"
                      )

                  path = pathlib.PurePosixPath(name)

                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(
                          f"Unsafe ZIP path: {name}"
                      )

                  if not path.parts:
                      raise SystemExit("Empty ZIP member name")

                  if path.parts[0] not in valid_roots:
                      raise SystemExit(
                          f"Unexpected ZIP root: {name}"
                      )

                  mode = info.external_attr >> 16

                  if stat.S_ISLNK(mode):
                      raise SystemExit(
                          f"Symbolic link in ZIP: {name}"
                      )

                  if info.is_dir():
                      continue

                  packaged_files.add(name)

                  if path.suffix.lower() in forbidden_suffixes:
                      raise SystemExit(
                          f"Forbidden build/helper file: {name}"
                      )

                  if path.name.lower() in forbidden_runtime_names:
                      raise SystemExit(
                          f"SteamVR runtime file included: {name}"
                      )

                  if info.file_size <= 0:
                      raise SystemExit(
                          f"Empty packaged file: {name}"
                      )

              missing = sorted(required - packaged_files)

              if missing:
                  raise SystemExit(
                      "Required package members are missing:\n"
                      + "\n".join(missing)
                  )

              for first, second in identical_pairs:
                  first_hash = hashlib.sha256(
                      archive.read(first)
                  ).digest()

                  second_hash = hashlib.sha256(
                      archive.read(second)
                  ).digest()

                  if first_hash != second_hash:
                      raise SystemExit(
                          "Compatibility copies differ: "
                          f"{first} and {second}"
                      )

          print(
              f"Validated {archive_path} "
              f"({archive_path.stat().st_size} bytes)"
          )
          PY

      - name: Upload all-in-one artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: all-in-one
          path: |
            all-in-one.zip
            all-in-one.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: false

      - name: Delete and recreate nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly \
              --cleanup-tag \
              --yes
          elif gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" \
            >/dev/null 2>&1; then
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly"
          fi

          gh release create nightly \
            all-in-one.zip \
            all-in-one.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "gVRMod nightly all-in-one" \
            --prerelease \
            --latest=false \
            --notes "Automated direct-extraction nightly build.

          OpenVR: ${OPENVR_VERSION}
          OpenXR SDK: ${OPENXR_SDK_VERSION}
          Node.js Actions runtime: 24
          Workflow run: ${GITHUB_RUN_ID}

          SteamVR or another compatible VR runtime must be installed separately.

          Extract the contents of all-in-one.zip directly into the GarrysMod installation directory."
