name: Build and publish nightly all-in-one

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 0"

permissions:
  contents: read
  actions: read

concurrency:
  group: gvrmod-nightly
  cancel-in-progress: false

env:
  GVRMOD_REPOSITORY: Abyss-c0re/gVRMod
  GVRMOD_REF: main

  OPENVR_MODULE_REPOSITORY: Abyss-c0re/vrmod-module-master
  OPENVR_MODULE_REF: main

  OPENVR_SDK_REPOSITORY: ValveSoftware/openvr
  OPENVR_SDK_SHA: 823135df1783009cb468d0fc4190816254f7687d

  OPENXR_SDK_REPOSITORY: KhronosGroup/OpenXR-SDK
  OPENXR_SDK_REF: release-1.1.60

jobs:
  resolve-revisions:
    name: Resolve immutable source revisions
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    outputs:
      gvrmod_sha: ${{ steps.refs.outputs.gvrmod_sha }}
      openvr_module_sha: ${{ steps.refs.outputs.openvr_module_sha }}
      openvr_sdk_sha: ${{ steps.refs.outputs.openvr_sdk_sha }}
      openxr_sdk_sha: ${{ steps.refs.outputs.openxr_sdk_sha }}

    steps:
      - name: Resolve source revisions
        id: refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gvrmod_sha="$(
            gh api \
              "repos/${GVRMOD_REPOSITORY}/commits/${GVRMOD_REF}" \
              --jq '.sha'
          )"

          openvr_module_sha="$(
            gh api \
              "repos/${OPENVR_MODULE_REPOSITORY}/commits/${OPENVR_MODULE_REF}" \
              --jq '.sha'
          )"

          openvr_sdk_sha="$(
            gh api \
              "repos/${OPENVR_SDK_REPOSITORY}/commits/${OPENVR_SDK_SHA}" \
              --jq '.sha'
          )"

          openxr_sdk_sha="$(
            gh api \
              "repos/${OPENXR_SDK_REPOSITORY}/commits/${OPENXR_SDK_REF}" \
              --jq '.sha'
          )"

          for sha in \
            "$gvrmod_sha" \
            "$openvr_module_sha" \
            "$openvr_sdk_sha" \
            "$openxr_sdk_sha"
          do
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Invalid resolved commit SHA: $sha"
              exit 1
            fi
          done

          {
            echo "gvrmod_sha=$gvrmod_sha"
            echo "openvr_module_sha=$openvr_module_sha"
            echo "openvr_sdk_sha=$openvr_sdk_sha"
            echo "openxr_sdk_sha=$openxr_sdk_sha"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Resolved source revisions"
            echo
            echo "- gVRMod: \`${gvrmod_sha}\`"
            echo "- vrmod-module-master: \`${openvr_module_sha}\`"
            echo "- Valve OpenVR SDK: \`${openvr_sdk_sha}\`"
            echo "- Khronos OpenXR SDK: \`${openxr_sdk_sha}\`"
            echo "- Builder workflow: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-linux:
    name: Build Linux x64
    needs: resolve-revisions
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out gVRMod
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Abyss-c0re/gVRMod
          ref: ${{ needs.resolve-revisions.outputs.gvrmod_sha }}
          path: src/gvrmod
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Check out OpenVR module
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Abyss-c0re/vrmod-module-master
          ref: ${{ needs.resolve-revisions.outputs.openvr_module_sha }}
          path: src/openvr-module
          fetch-depth: 1
          persist-credentials: false

      - name: Check out official OpenVR SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ValveSoftware/openvr
          ref: ${{ needs.resolve-revisions.outputs.openvr_sdk_sha }}
          path: src/openvr-sdk
          fetch-depth: 1
          persist-credentials: false

      - name: Check out official OpenXR SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KhronosGroup/OpenXR-SDK
          ref: ${{ needs.resolve-revisions.outputs.openxr_sdk_sha }}
          path: src/openxr-sdk
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source layout
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PWD/src/gvrmod/CMakeLists.txt"
          test -f "$PWD/src/gvrmod/addon/vrmod-x64/addon.json"
          test -f "$PWD/src/openvr-module/src/vrmod.cpp"
          test -f "$PWD/src/openvr-sdk/headers/openvr.h"
          test -f "$PWD/src/openxr-sdk/include/openxr/openxr.h"

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            file \
            libgl1-mesa-dev \
            libx11-dev \
            luajit \
            ninja-build

      - name: Prepare native module headers
        shell: bash
        run: |
          set -euo pipefail

          gvrmod="$PWD/src/gvrmod"

          install -d \
            "$gvrmod/deps/gmod" \
            "$gvrmod/deps/openxr" \
            "$PWD/build-deps/openvr"

          cp -a \
            "$PWD/src/openvr-module/deps/gmod/." \
            "$gvrmod/deps/gmod/"

          cp -a \
            "$PWD/src/openxr-sdk/include/openxr" \
            "$gvrmod/deps/openxr/"

          install -m 0644 \
            "$PWD/src/openvr-sdk/headers/openvr.h" \
            "$PWD/build-deps/openvr/openvr.h"

          test -f "$gvrmod/deps/gmod/Interface.h"
          test -f "$gvrmod/deps/openxr/openxr/openxr.h"
          test -f "$PWD/build-deps/openvr/openvr.h"

      - name: Build gVRMod OpenXR and Quest modules
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S "$PWD/src/gvrmod" \
            -B "$PWD/build/gvrmod-linux" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVRMOD_BUILD_TESTS=ON \
            -DVRMOD_BUILD_QUEST=ON

          cmake \
            --build "$PWD/build/gvrmod-linux" \
            --target vrmod_release vrmod_quest vrmod_tests \
            --parallel 2

          test_binary="$(
            find "$PWD/build/gvrmod-linux" \
              -type f \
              -name vrmod_tests \
              -print \
              -quit
          )"

          if [[ -z "$test_binary" ]]; then
            echo "::error::vrmod_tests was not produced"
            exit 1
          fi

          "$test_binary"

      - name: Run contract and Lua tests
        shell: bash
        run: |
          set -euo pipefail

          pushd "$PWD/src/gvrmod" >/dev/null

          python3 scripts/gen_contracts.py
          python3 scripts/check_test_contracts.py
          luajit tests/lua/run.lua
          luajit tests/scenarios/run.lua

          popd >/dev/null

      - name: Build unchanged OpenVR module
        shell: bash
        run: |
          set -euo pipefail

          out="$PWD/dist-linux/runtime"
          mkdir -p "$out"

          g++ \
            -fPIC \
            -shared \
            -m64 \
            -O3 \
            -I "$PWD/build-deps" \
            -I "$PWD/src/openvr-module/deps" \
            "$PWD/src/openvr-module/src/vrmod.cpp" \
            -L "$PWD/src/openvr-sdk/bin/linux64" \
            -Wl,-rpath,'$ORIGIN' \
            -l:libopenvr_api.so \
            -ldl \
            -o "$out/gmcl_vrmod_linux64.dll"

      - name: Build official OpenXR loader
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S "$PWD/src/openxr-sdk" \
            -B "$PWD/build/openxr-loader-linux" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install/openxr-loader-linux" \
            -DBUILD_LOADER=ON \
            -DDYNAMIC_LOADER=ON \
            -DBUILD_API_LAYERS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_SDK_TESTS=OFF \
            -DBUILD_CONFORMANCE_TESTS=OFF

          cmake \
            --build "$PWD/build/openxr-loader-linux" \
            --target openxr_loader \
            --parallel 2

          cmake --install "$PWD/build/openxr-loader-linux"

          loader="$(
            find "$PWD/install/openxr-loader-linux" \
              -type f \
              -name 'libopenxr_loader.so.*' \
              | sort \
              | head -n 1
          )"

          if [[ -z "$loader" || ! -f "$loader" ]]; then
            echo "::error::Built OpenXR loader was not found"
            exit 1
          fi

          install -d "$PWD/dist-linux/runtime"

          install -m 0755 \
            "$loader" \
            "$PWD/dist-linux/runtime/libopenxr_loader.so.1"

          # Use a real file instead of a symlink for cross-platform ZIP tools.
          install -m 0755 \
            "$loader" \
            "$PWD/dist-linux/runtime/libopenxr_loader.so"

      - name: Collect Linux runtime files
        shell: bash
        run: |
          set -euo pipefail

          gvrmod="$PWD/src/gvrmod"
          runtime="$PWD/dist-linux/runtime"
          licenses="$PWD/dist-linux/licenses"

          mkdir -p "$runtime" "$licenses"

          xr_module="$(
            find "$gvrmod/install/GarrysMod/garrysmod/lua/bin" \
              -type f \
              -name gmcl_vrmod_xr_linux64.dll \
              -print \
              -quit
          )"

          quest_module="$(
            find "$gvrmod/install/GarrysMod/garrysmod/lua/bin" \
              -type f \
              -name gmcl_vrmod_quest_linux64.dll \
              -print \
              -quit
          )"

          if [[ -z "$xr_module" ]]; then
            echo "::error::gmcl_vrmod_xr_linux64.dll was not produced"
            exit 1
          fi

          if [[ -z "$quest_module" ]]; then
            echo "::error::gmcl_vrmod_quest_linux64.dll was not produced"
            exit 1
          fi

          install -m 0755 \
            "$xr_module" \
            "$runtime/gmcl_vrmod_xr_linux64.dll"

          install -m 0755 \
            "$quest_module" \
            "$runtime/gmcl_vrmod_quest_linux64.dll"

          install -m 0755 \
            "$PWD/src/openvr-sdk/bin/linux64/libopenvr_api.so" \
            "$runtime/libopenvr_api.so"

          install -m 0644 \
            "$PWD/src/openvr-module/LICENSE" \
            "$licenses/vrmod-module-master-LICENSE.txt"

          install -m 0644 \
            "$PWD/src/openvr-sdk/LICENSE" \
            "$licenses/OpenVR-SDK-LICENSE.txt"

          install -m 0644 \
            "$PWD/src/openxr-sdk/LICENSE" \
            "$licenses/OpenXR-SDK-LICENSE.txt"

      - name: Validate Linux binaries
        shell: bash
        run: |
          set -euo pipefail

          runtime="$PWD/dist-linux/runtime"

          required=(
            gmcl_vrmod_linux64.dll
            gmcl_vrmod_xr_linux64.dll
            gmcl_vrmod_quest_linux64.dll
            libopenvr_api.so
            libopenxr_loader.so
            libopenxr_loader.so.1
          )

          for name in "${required[@]}"; do
            path="$runtime/$name"

            if [[ ! -s "$path" ]]; then
              echo "::error::Required Linux runtime file is missing: $path"
              exit 1
            fi

            file "$path"
          done

          elf_files=(
            "$runtime/gmcl_vrmod_linux64.dll"
            "$runtime/gmcl_vrmod_xr_linux64.dll"
            "$runtime/gmcl_vrmod_quest_linux64.dll"
            "$runtime/libopenvr_api.so"
            "$runtime/libopenxr_loader.so.1"
          )

          for binary in "${elf_files[@]}"; do
            if ! file "$binary" | grep -Eq 'ELF 64-bit.*x86-64'; then
              echo "::error::$binary is not an x86-64 ELF binary"
              exit 1
            fi

            ldd_output="$(ldd "$binary")"
            printf '%s\n' "$ldd_output"

            if grep -q 'not found' <<< "$ldd_output"; then
              echo "::error::Unresolved dependency in $binary"
              exit 1
            fi
          done

      - name: Upload Linux runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-runtime
          path: dist-linux
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  build-windows:
    name: Build Windows and Wine x64
    needs: resolve-revisions
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out gVRMod
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Abyss-c0re/gVRMod
          ref: ${{ needs.resolve-revisions.outputs.gvrmod_sha }}
          path: src/gvrmod
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Check out OpenVR module
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Abyss-c0re/vrmod-module-master
          ref: ${{ needs.resolve-revisions.outputs.openvr_module_sha }}
          path: src/openvr-module
          fetch-depth: 1
          persist-credentials: false

      - name: Check out official OpenVR SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ValveSoftware/openvr
          ref: ${{ needs.resolve-revisions.outputs.openvr_sdk_sha }}
          path: src/openvr-sdk
          fetch-depth: 1
          persist-credentials: false

      - name: Check out official OpenXR SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KhronosGroup/OpenXR-SDK
          ref: ${{ needs.resolve-revisions.outputs.openxr_sdk_sha }}
          path: src/openxr-sdk
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "src\gvrmod\CMakeLists.txt"
            "src\gvrmod\addon\vrmod-x64\addon.json"
            "src\openvr-module\src\vrmod.cpp"
            "src\openvr-sdk\headers\openvr.h"
            "src\openxr-sdk\include\openxr\openxr.h"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Required source path was not checked out: $path"
            }
          }

      - name: Prepare native module headers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = (Get-Location).Path

          $directories = @(
            "$root\src\gvrmod\deps\gmod"
            "$root\src\gvrmod\deps\openxr"
            "$root\build-deps\openvr"
          )

          foreach ($directory in $directories) {
            New-Item `
              -ItemType Directory `
              -Path $directory `
              -Force | Out-Null
          }

          Copy-Item `
            "$root\src\openvr-module\deps\gmod\*" `
            "$root\src\gvrmod\deps\gmod" `
            -Recurse `
            -Force

          Copy-Item `
            "$root\src\openxr-sdk\include\openxr" `
            "$root\src\gvrmod\deps\openxr\openxr" `
            -Recurse `
            -Force

          Copy-Item `
            "$root\src\openvr-sdk\headers\openvr.h" `
            "$root\build-deps\openvr\openvr.h" `
            -Force

          if (-not (Test-Path "$root\src\gvrmod\deps\gmod\Interface.h")) {
            throw "GMod module headers are missing"
          }

          if (
            -not (
              Test-Path `
                "$root\src\gvrmod\deps\openxr\openxr\openxr.h"
            )
          ) {
            throw "OpenXR headers are missing"
          }

      - name: Build and test gVRMod OpenXR module
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          $root = (Get-Location).Path
          $source = "$root\src\gvrmod"
          $build = "$root\build\gvrmod-windows"

          cmake `
            -S $source `
            -B $build `
            -A x64 `
            -DVRMOD_BUILD_TESTS=ON `
            -DVRMOD_BUILD_QUEST=OFF

          cmake `
            --build $build `
            --config Release `
            --target vrmod_release vrmod_tests `
            --parallel 2

          $testBinary = Get-ChildItem `
            $build `
            -Recurse `
            -File `
            -Filter "vrmod_tests.exe" |
            Select-Object -First 1

          if (-not $testBinary) {
            throw "vrmod_tests.exe was not produced"
          }

          & $testBinary.FullName

      - name: Build unchanged OpenVR module with MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          $root = (Get-Location).Path

          $vswhere = Join-Path `
            ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer\vswhere.exe"

          $vsPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsPath) {
            throw "Visual Studio C++ toolchain was not found"
          }

          Import-Module (
            Join-Path `
              $vsPath `
              "Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          )

          Enter-VsDevShell `
            -VsInstallPath $vsPath `
            -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -host_arch=x64"

          $outDir = "$root\dist-windows\runtime"

          New-Item `
            -ItemType Directory `
            -Path $outDir `
            -Force | Out-Null

          $compilerArgs = @(
            "/nologo"
            "/LD"
            "/MT"
            "/O2"
            "/EHsc"
            "/std:c++17"
            "/W3"
            "/wd4996"
            "/D_CRT_SECURE_NO_WARNINGS"
            "/DNOMINMAX"
            "/DWIN32_LEAN_AND_MEAN"
            "/I$root\build-deps"
            "/I$root\src\openvr-module\deps"
            "$root\src\openvr-module\src\vrmod.cpp"
            "/Fo$outDir\vrmod.obj"
            "/link"
            "/INCREMENTAL:NO"
            "/OPT:REF"
            "d3d11.lib"
            "dxgi.lib"
            "user32.lib"
            "shell32.lib"
            "/LIBPATH:$root\src\openvr-sdk\lib\win64"
            "openvr_api.lib"
            "/OUT:$outDir\gmcl_vrmod_win64.dll"
            "/IMPLIB:$outDir\gmcl_vrmod_win64.lib"
          )

          & cl.exe @compilerArgs

          Remove-Item `
            "$outDir\vrmod.obj", `
            "$outDir\gmcl_vrmod_win64.lib", `
            "$outDir\gmcl_vrmod_win64.exp" `
            -Force `
            -ErrorAction SilentlyContinue

      - name: Build official OpenXR loader
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          $root = (Get-Location).Path
          $source = "$root\src\openxr-sdk"
          $build = "$root\build\openxr-loader-windows"
          $installPrefix = "$root\install\openxr-loader-windows"

          cmake `
            -S $source `
            -B $build `
            -A x64 `
            -DCMAKE_INSTALL_PREFIX="$installPrefix" `
            -DBUILD_LOADER=ON `
            -DDYNAMIC_LOADER=ON `
            -DBUILD_API_LAYERS=OFF `
            -DBUILD_TESTS=OFF `
            -DBUILD_SDK_TESTS=OFF `
            -DBUILD_CONFORMANCE_TESTS=OFF `
            -DINSTALL_SYMBOLS=OFF

          cmake `
            --build $build `
            --config Release `
            --target openxr_loader `
            --parallel 2

          cmake `
            --install $build `
            --config Release

          $loader = Get-ChildItem `
            $installPrefix `
            -Recurse `
            -File `
            -Filter "openxr_loader.dll" |
            Select-Object -First 1

          if (-not $loader) {
            throw "Built openxr_loader.dll was not found"
          }

          $runtime = "$root\dist-windows\runtime"

          New-Item `
            -ItemType Directory `
            -Path $runtime `
            -Force | Out-Null

          Copy-Item `
            $loader.FullName `
            "$runtime\openxr_loader.dll" `
            -Force

      - name: Collect Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = (Get-Location).Path
          $runtime = "$root\dist-windows\runtime"
          $gvrmodInstall = (
            "$root\src\gvrmod\install\GarrysMod\garrysmod\lua\bin"
          )

          $xrModule = Get-ChildItem `
            $gvrmodInstall `
            -Recurse `
            -File `
            -Filter "gmcl_vrmod_xr_win64.dll" |
            Select-Object -First 1

          if (-not $xrModule) {
            throw "gmcl_vrmod_xr_win64.dll was not produced"
          }

          Copy-Item `
            $xrModule.FullName `
            "$runtime\gmcl_vrmod_xr_win64.dll" `
            -Force

          Copy-Item `
            "$root\src\openvr-sdk\bin\win64\openvr_api.dll" `
            "$runtime\openvr_api.dll" `
            -Force

      - name: Validate Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = (Get-Location).Path
          $runtime = "$root\dist-windows\runtime"

          function Get-PeMachine {
            param(
              [Parameter(Mandatory)]
              [string] $Path
            )

            $resolved = (Resolve-Path $Path).Path
            $bytes = [System.IO.File]::ReadAllBytes($resolved)

            if (
              $bytes.Length -lt 64 -or
              $bytes[0] -ne 0x4d -or
              $bytes[1] -ne 0x5a
            ) {
              throw "$Path is not a PE file"
            }

            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)

            if ($peOffset + 6 -gt $bytes.Length) {
              throw "$Path has an invalid PE header"
            }

            return [BitConverter]::ToUInt16(
              $bytes,
              $peOffset + 4
            )
          }

          $required = @(
            "$runtime\gmcl_vrmod_win64.dll"
            "$runtime\gmcl_vrmod_xr_win64.dll"
            "$runtime\openvr_api.dll"
            "$runtime\openxr_loader.dll"
          )

          foreach ($path in $required) {
            if (
              -not (Test-Path $path) -or
              (Get-Item $path).Length -eq 0
            ) {
              throw "Required Windows runtime file is missing: $path"
            }

            $machine = Get-PeMachine -Path $path

            if ($machine -ne 0x8664) {
              throw (
                "{0} is not an AMD64 PE binary " +
                "(machine=0x{1:X4})" -f $path, $machine
              )
            }

            Get-FileHash `
              -Algorithm SHA256 `
              -Path $path |
              Format-Table -AutoSize
          }

      - name: Upload Windows runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-runtime
          path: dist-windows
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  assemble-and-publish:
    name: Assemble and publish all-in-one.zip
    needs:
      - resolve-revisions
      - build-linux
      - build-windows

    runs-on: ubuntu-22.04
    timeout-minutes: 20

    permissions:
      contents: write
      actions: read

    steps:
      - name: Check out exact gVRMod source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Abyss-c0re/gVRMod
          ref: ${{ needs.resolve-revisions.outputs.gvrmod_sha }}
          path: src/gvrmod
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Download Linux runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-runtime
          path: artifacts/linux

      - name: Download Windows runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-runtime
          path: artifacts/windows

      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            jq \
            unzip \
            zip

      - name: Assemble direct-extraction GarrysMod tree
        shell: bash
        env:
          GVRMOD_SHA: ${{ needs.resolve-revisions.outputs.gvrmod_sha }}
          OPENVR_MODULE_SHA: ${{ needs.resolve-revisions.outputs.openvr_module_sha }}
          OPENVR_SDK_RESOLVED_SHA: ${{ needs.resolve-revisions.outputs.openvr_sdk_sha }}
          OPENXR_SDK_SHA: ${{ needs.resolve-revisions.outputs.openxr_sdk_sha }}
        run: |
          set -euo pipefail

          gvrmod="$PWD/src/gvrmod"
          package_root="$PWD/staging"
          addon_dir="$package_root/garrysmod/addons/vrmod-x64"
          lua_bin="$package_root/garrysmod/lua/bin"

          install -d \
            "$addon_dir" \
            "$lua_bin" \
            "$package_root/bin/linux64" \
            "$package_root/bin/win64" \
            "$package_root/licenses"

          # Copy only runtime content from vrmod-x64.
          # Repository scripts, state files and development documents are excluded.
          for item in addon.json lua materials models; do
            source_path="$gvrmod/addon/vrmod-x64/$item"

            if [[ ! -e "$source_path" ]]; then
              echo "::error::Missing addon runtime path: $source_path"
              exit 1
            fi

            cp -a "$source_path" "$addon_dir/"
          done

          # Put every platform module and loader next to the Lua modules.
          for file in \
            "$PWD"/artifacts/linux/runtime/* \
            "$PWD"/artifacts/windows/runtime/*
          do
            install -m 0755 \
              "$file" \
              "$lua_bin/$(basename "$file")"
          done

          # Compatibility copies for Garry's Mod engine library search paths.
          install -m 0755 \
            "$PWD/artifacts/linux/runtime/libopenvr_api.so" \
            "$package_root/bin/libopenvr_api.so"

          install -m 0755 \
            "$PWD/artifacts/linux/runtime/libopenvr_api.so" \
            "$package_root/bin/linux64/libopenvr_api.so"

          install -m 0755 \
            "$PWD/artifacts/linux/runtime/libopenxr_loader.so" \
            "$package_root/bin/linux64/libopenxr_loader.so"

          install -m 0755 \
            "$PWD/artifacts/linux/runtime/libopenxr_loader.so.1" \
            "$package_root/bin/linux64/libopenxr_loader.so.1"

          install -m 0755 \
            "$PWD/artifacts/windows/runtime/openvr_api.dll" \
            "$package_root/bin/openvr_api.dll"

          install -m 0755 \
            "$PWD/artifacts/windows/runtime/openvr_api.dll" \
            "$package_root/bin/win64/openvr_api.dll"

          install -m 0755 \
            "$PWD/artifacts/windows/runtime/openxr_loader.dll" \
            "$package_root/bin/openxr_loader.dll"

          install -m 0755 \
            "$PWD/artifacts/windows/runtime/openxr_loader.dll" \
            "$package_root/bin/win64/openxr_loader.dll"

          # Licenses.
          install -m 0644 \
            "$gvrmod/LICENSE" \
            "$package_root/licenses/gVRMod-LICENSE.txt"

          install -m 0644 \
            "$gvrmod/addon/vrmod-x64/LICENSE" \
            "$package_root/licenses/vrmod-x64-LICENSE.txt"

          install -m 0644 \
            "$PWD"/artifacts/linux/licenses/*.txt \
            "$package_root/licenses/"

          vrmod_x64_sha="$(
            git -C "$gvrmod/addon/vrmod-x64" rev-parse HEAD
          )"

          generated_at="$(
            date -u '+%Y-%m-%dT%H:%M:%SZ'
          )"

          jq -n \
            --arg name "gVRMod all-in-one nightly" \
            --arg generated_at "$generated_at" \
            --arg builder_repository "$GITHUB_REPOSITORY" \
            --arg builder_commit "$GITHUB_SHA" \
            --arg gvrmod "$GVRMOD_SHA" \
            --arg vrmod_x64 "$vrmod_x64_sha" \
            --arg openvr_module "$OPENVR_MODULE_SHA" \
            --arg openvr_sdk "$OPENVR_SDK_RESOLVED_SHA" \
            --arg openxr_sdk "$OPENXR_SDK_SHA" \
            '{
              name: $name,
              generated_at: $generated_at,
              architecture: "x86_64",
              builder: {
                repository: $builder_repository,
                commit: $builder_commit
              },
              sources: {
                gVRMod: $gvrmod,
                vrmod_x64: $vrmod_x64,
                vrmod_module_master: $openvr_module,
                Valve_OpenVR_SDK: $openvr_sdk,
                Khronos_OpenXR_SDK: $openxr_sdk
              }
            }' > "$package_root/BUILD-MANIFEST.json"

          printf '%s\n' \
            'gVRMod all-in-one nightly (x86-64)' \
            '' \
            'INSTALLATION' \
            '1. Close Garry'\''s Mod.' \
            '2. Extract this archive directly into the GarrysMod game directory.' \
            '3. Merge the existing bin/ and garrysmod/ directories.' \
            '4. Start a working OpenXR or OpenVR/SteamVR runtime.' \
            '5. Start the 64-bit version of Garry'\''s Mod.' \
            '6. Open the console and run: vrmod' \
            '' \
            'Backend selection:' \
            '  vrmod_prefer_backend auto' \
            '  vrmod_prefer_backend openxr' \
            '  vrmod_prefer_backend openvr' \
            '  vrmod_backend' \
            '' \
            'The archive contains no installer, launcher, .sh, .bat or .exe files.' \
            'A headset runtime is still required and is not modified by this package.' \
            > "$package_root/README.txt"

      - name: Validate package contents
        shell: bash
        run: |
          set -euo pipefail

          required=(
            staging/garrysmod/addons/vrmod-x64/addon.json
            staging/garrysmod/addons/vrmod-x64/lua/autorun/vrmod_init.lua
            staging/garrysmod/lua/bin/gmcl_vrmod_linux64.dll
            staging/garrysmod/lua/bin/gmcl_vrmod_win64.dll
            staging/garrysmod/lua/bin/gmcl_vrmod_xr_linux64.dll
            staging/garrysmod/lua/bin/gmcl_vrmod_xr_win64.dll
            staging/garrysmod/lua/bin/gmcl_vrmod_quest_linux64.dll
            staging/garrysmod/lua/bin/libopenvr_api.so
            staging/garrysmod/lua/bin/libopenxr_loader.so
            staging/garrysmod/lua/bin/libopenxr_loader.so.1
            staging/garrysmod/lua/bin/openvr_api.dll
            staging/garrysmod/lua/bin/openxr_loader.dll
            staging/bin/linux64/libopenvr_api.so
            staging/bin/linux64/libopenxr_loader.so.1
            staging/bin/win64/openvr_api.dll
            staging/bin/win64/openxr_loader.dll
            staging/BUILD-MANIFEST.json
            staging/README.txt
          )

          for path in "${required[@]}"; do
            if [[ ! -s "$path" ]]; then
              echo "::error::Required package file is missing or empty: $path"
              exit 1
            fi
          done

          unexpected_scripts="$(
            find staging \
              -type f \
              \( \
                -iname '*.sh' \
                -o -iname '*.bat' \
                -o -iname '*.cmd' \
                -o -iname '*.exe' \
              \) \
              -print
          )"

          if [[ -n "$unexpected_scripts" ]]; then
            echo "::error::Installer or executable files leaked into the package"
            printf '%s\n' "$unexpected_scripts"
            exit 1
          fi

          unexpected_links="$(
            find staging -type l -print
          )"

          if [[ -n "$unexpected_links" ]]; then
            echo "::error::Symbolic links are not allowed in the ZIP"
            printf '%s\n' "$unexpected_links"
            exit 1
          fi

      - name: Create and verify all-in-one.zip
        shell: bash
        env:
          GVRMOD_SHA: ${{ needs.resolve-revisions.outputs.gvrmod_sha }}
        run: |
          set -euo pipefail

          source_date_epoch="$(
            git -C "$PWD/src/gvrmod" \
              show \
              -s \
              --format=%ct \
              "$GVRMOD_SHA"
          )"

          find staging \
            -exec touch -h -d "@${source_date_epoch}" {} +

          (
            cd staging

            TZ=UTC zip \
              -X \
              -9 \
              -r \
              ../all-in-one.zip \
              garrysmod \
              bin \
              licenses \
              README.txt \
              BUILD-MANIFEST.json
          )

          unzip -t all-in-one.zip

          invalid_roots="$(
            unzip -Z1 all-in-one.zip |
              awk -F/ '
                $1 != "garrysmod" &&
                $1 != "bin" &&
                $1 != "licenses" &&
                $1 != "README.txt" &&
                $1 != "BUILD-MANIFEST.json" {
                  print
                }
              '
          )"

          if [[ -n "$invalid_roots" ]]; then
            echo "::error::Archive contains an unexpected top-level path"
            printf '%s\n' "$invalid_roots"
            exit 1
          fi

          sha256sum all-in-one.zip > SHA256SUMS

          {
            echo "### Release artifact"
            echo
            echo "- File: \`all-in-one.zip\`"
            echo "- Size: \`$(stat -c '%s' all-in-one.zip)\` bytes"
            echo "- SHA-256: \`$(cut -d ' ' -f 1 SHA256SUMS)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: all-in-one
          path: |
            all-in-one.zip
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Replace nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Keep the previous release available until the replacement ZIP
          # has been built, validated and uploaded successfully.
          if gh release view \
            nightly \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1
          then
            gh release delete \
              nightly \
              --repo "$GITHUB_REPOSITORY" \
              --cleanup-tag \
              --yes
          fi

          # Remove a possible orphaned tag from an interrupted older run.
          if gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" \
            >/dev/null 2>&1
          then
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly"
          fi

          printf '%s\n' \
            '# gVRMod nightly all-in-one' \
            '' \
            '- Directly extractable into the GarrysMod game directory.' \
            '- Includes native Linux x64 and Windows/Wine x64 modules.' \
            '- Includes unchanged official OpenXR and OpenVR loaders.' \
            '- Contains no installer scripts or external launcher executables.' \
            '- OpenXR is preferred automatically; OpenVR remains available.' \
            '- Exact source revisions are recorded in BUILD-MANIFEST.json.' \
            '- HMD testing remains a manual release smoke test.' \
            > release-notes.md

          release_date="$(date -u '+%Y-%m-%d')"

          gh release create \
            nightly \
            all-in-one.zip \
            SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "gVRMod nightly ${release_date}" \
            --notes-file release-notes.md \
            --prerelease
